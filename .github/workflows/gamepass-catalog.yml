# Refreshes the Game Pass catalog copy on the website (gh-pages/gamepass.json) once a day,
# so the "Game Pass" category can be browsed while no PC is connected. A connected PC always uses its own live catalog.
name: Game-Pass-Katalog aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: gamepass.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Katalog abrufen
        run: node main/scripts/gamepass-snapshot.mjs site/gamepass.json DE de-de
      - name: Veröffentlichen
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamepass.json
          git diff --cached --quiet || { git commit -m "Game-Pass-Katalog aktualisieren"; git push; }
